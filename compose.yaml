name: arborvault
services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    environment:
      POSTGRES_USER: arborvault
      POSTGRES_DB: arborvault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arborvault -d arborvault"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [database]
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql://arborvault:${POSTGRES_PASSWORD}@db:5432/arborvault
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run configure.py --upgrade for v0.1}
    command: ["python", "-m", "arborvault.migrate", "--provision-role"]
    depends_on:
      db:
        condition: service_healthy
    networks: [database]
  parser:
    build: .
    command: ["uvicorn", "arborvault.parse_api:app", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    pids_limit: 32
    networks: [parsing]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://arborvault_app:${APP_DATABASE_PASSWORD}@db:5432/arborvault
      ARBORVAULT_KEYS_FILE: /run/arborvault/keys.json
      PARSER_URL: http://parser:8001
      RATE_PER_MINUTE: ${RATE_PER_MINUTE:-60}
      RATE_BURST: ${RATE_BURST:-60}
      SELECTOR_URL: ${SELECTOR_URL:-}
      SELECTOR_MODEL: ${SELECTOR_MODEL:-}
      SELECTOR_API_KEY: ${SELECTOR_API_KEY:-}
    volumes: ["./.secrets:/run/arborvault:ro"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 2
    pids_limit: 64
    networks: [database, parsing, outbound]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
networks:
  database:
    internal: true
  parsing:
    internal: true
  outbound:
