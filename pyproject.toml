[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arborvault"
version = "0.3.0"
description = "Structure-aware knowledge retrieval for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "ArborVault contributors"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4", "markdown-it-py>=3,<5",
  "beautifulsoup4>=4.13,<5", "pypdf>=6,<7", "python-docx>=1.2,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "pip-audit>=2.9,<3"]
eval = ["fastembed>=0.7,<1", "numpy>=2,<3"]
ocr = ["pypdfium2>=5,<6", "Pillow>=12,<14"]

[project.scripts]
arborvault-eval = "arborvault.evaluate:main"
arborvault-migrate = "arborvault.migrate:main"
arborvault-dataset = "arborvault.dataset:main"
arborvault-benchmark = "arborvault.benchmark:main"
arborvault-routing-data = "arborvault.training_data:main"
arborvault-llm-eval = "arborvault.llm_eval:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arborvault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["datasets/**/corpus/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header"]
