name: arborvault-test
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: synthetic-local-test-only
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 2s
      retries: 20
    tmpfs: /var/lib/postgresql/data
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql://test:synthetic-local-test-only@db:5432/test
    depends_on:
      db:
        condition: service_healthy
